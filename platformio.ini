[env:wemos_d1_mini32]
platform = platformio/espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.9.0

[env:wemos_d1_mini32_ota]
extends = env:wemos_d1_mini32
upload_protocol = espota
upload_port = terrassenheizer.local
upload_flags =
    --auth=${sysenv.VASNER_OTA_PASSWORD}
